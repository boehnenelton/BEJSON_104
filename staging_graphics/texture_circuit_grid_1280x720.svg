<svg class="canvas-fill" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Seamless 64x64 Circuit Trace Pattern -->
        <pattern id="circuit-pattern" width="64" height="64" patternUnits="userSpaceOnUse" class="anim-drift">
          <!-- Dark background base -->
          <rect width="64" height="64" fill="#040407"/>

          <!-- Secondary Grid lines (subtle) -->
          <path d="M 0,0 L 64,0 L 64,64 L 0,64 Z" fill="none" stroke="#0e0e14" stroke-width="0.5"/>

          <!-- Seamless Horizontal and Vertical Traces matching opposite edges -->
          <!-- Horizontal trace passing through y=32 -->
          <line x1="0" y1="32" x2="20" y2="32" stroke="#22222a" stroke-width="1.5"/>
          <line x1="44" y1="32" x2="64" y2="32" stroke="#22222a" stroke-width="1.5"/>

          <!-- Vertical trace passing through x=32 -->
          <line x1="32" y1="0" x2="32" y2="20" stroke="#22222a" stroke-width="1.5"/>
          <line x1="32" y1="44" x2="32" y2="64" stroke="#22222a" stroke-width="1.5"/>

          <!-- Corner bypass route (from x=0, y=16 to x=16, y=0) -->
          <path d="M 0,16 L 8,16 L 16,8 L 16,0" fill="none" stroke="#1c1c24" stroke-width="1.2"/>
          <!-- Matching corner bypass (from x=64, y=48 to x=48, y=64) -->
          <path d="M 64,48 L 56,48 L 48,56 L 48,64" fill="none" stroke="#1c1c24" stroke-width="1.2"/>

          <!-- Active Red High-Speed Bus Trace passing through (y=48) -->
          <line x1="0" y1="48" x2="64" y2="48" stroke="#DE2626" stroke-width="1" class="anim-pulse"/>

          <!-- Central Junction Pad Node -->
          <circle cx="32" cy="32" r="6" fill="#0a0a0f" stroke="#33333f" stroke-width="1"/>
          <circle cx="32" cy="32" r="3" fill="#DE2626" class="anim-pulse"/>

          <!-- Edge Connection Terminals (matching seamlessly at borders) -->
          <circle cx="0" cy="32" r="2" fill="#22222a"/>
          <circle cx="64" cy="32" r="2" fill="#22222a"/>
          <circle cx="32" cy="0" r="2" fill="#22222a"/>
          <circle cx="32" cy="64" r="2" fill="#22222a"/>

          <!-- Diagonal accent node pads -->
          <rect x="14" y="46" width="4" height="4" fill="#FFFFFF" opacity="0.7"/>
          <rect x="46" y="14" width="4" height="4" fill="#FFFFFF" opacity="0.7"/>
        </pattern>
      </defs>

      <!-- Fill entire canvas with seamless pattern -->
      <rect width="100%" height="100%" fill="url(#circuit-pattern)"/>

      <!-- Ambient Vignette -->
      <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
        <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
      </radialGradient>
      <rect width="100%" height="100%" fill="url(#vignette)" pointer-events="none"/>
    </svg>