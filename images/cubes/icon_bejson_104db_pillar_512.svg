<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bgGrad104db" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0a0a10"/>
            <stop offset="100%" stop-color="#020204"/>
          </linearGradient>
          <linearGradient id="topWhite" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#CCCCCC"/>
          </linearGradient>
        </defs>

        <!-- Outer Squircle Frame -->
        <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad104db)" stroke="#202030" stroke-width="3"/>
        <rect x="32" y="32" width="448" height="448" rx="100" fill="none" stroke="#DE2626" stroke-width="1.5" stroke-dasharray="10 6" opacity="0.6"/>

        <!-- Vertical Rail Accents -->
        <line x1="120" y1="64" x2="120" y2="448" stroke="#1c1c28" stroke-width="1.5"/>
        <line x1="392" y1="64" x2="392" y2="448" stroke="#1c1c28" stroke-width="1.5"/>
        <line x1="120" y1="200" x2="120" y2="300" stroke="#DE2626" stroke-width="2"/>
        <line x1="392" y1="200" x2="392" y2="300" stroke="#DE2626" stroke-width="2"/>

        <g class="anim-pillar">
          <!-- Cube 1 (Bottom Tier) -->
          <g transform="translate(0, 110)">
            <polygon points="256,230 326,270 256,310 186,270" fill="#20202c" stroke="#3d3d52" stroke-width="2"/>
            <polygon points="256,310 186,270 186,340 256,380" fill="#181822" stroke="#3d3d52" stroke-width="2"/>
            <polygon points="256,310 326,270 326,340 256,380" fill="#101018" stroke="#3d3d52" stroke-width="2"/>
            <line x1="256" y1="310" x2="256" y2="380" stroke="#DE2626" stroke-width="2.5"/>
            <circle cx="256" cy="310" r="4" class="anim-node3"/>
          </g>

          <!-- Cube 2 (Middle Tier) -->
          <g transform="translate(0, 40)">
            <polygon points="256,180 326,220 256,260 186,220" fill="#2c2c3d" stroke="#484860" stroke-width="2"/>
            <polygon points="256,260 186,220 186,290 256,330" fill="#20202c" stroke="#484860" stroke-width="2"/>
            <polygon points="256,260 326,220 326,290 256,330" fill="#161620" stroke="#484860" stroke-width="2"/>
            <line x1="256" y1="260" x2="256" y2="330" stroke="#DE2626" stroke-width="2.5"/>
            <circle cx="256" cy="260" r="4" class="anim-node2"/>
          </g>

          <!-- Cube 3 (Top Tier Monolith) -->
          <g transform="translate(0, -30)">
            <polygon points="256,130 326,170 256,210 186,170" fill="url(#topWhite)" stroke="#DE2626" stroke-width="2"/>
            <polygon points="256,210 186,170 186,240 256,280" fill="#2c2c3d" stroke="#DE2626" stroke-width="2"/>
            <polygon points="256,210 326,170 326,240 256,280" fill="#1c1c28" stroke="#DE2626" stroke-width="2"/>
            <line x1="256" y1="210" x2="256" y2="280" stroke="#DE2626" stroke-width="3"/>
            <circle cx="256" cy="130" r="5" fill="#DE2626"/>
            <circle cx="256" cy="210" r="4.5" class="anim-node1"/>
          </g>
        </g>

        <!-- Title & Spec Labels -->
        <text x="256" y="80" fill="#DE2626" font-size="15" font-family="monospace" font-weight="700" letter-spacing="4" text-anchor="middle">BEJSON 104db</text>
        <text x="256" y="98" fill="#666677" font-size="10" font-family="monospace" letter-spacing="2" text-anchor="middle">STACKED PILLAR TAXONOMY</text>
      </svg>