<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bgGrad104a" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0e0a0a"/>
            <stop offset="100%" stop-color="#020202"/>
          </linearGradient>
          <linearGradient id="floatingTop" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#E0E0E0"/>
          </linearGradient>
          <linearGradient id="baseLeft" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2a2224"/>
            <stop offset="100%" stop-color="#120e10"/>
          </linearGradient>
          <linearGradient id="baseRight" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1c1618"/>
            <stop offset="100%" stop-color="#0c090a"/>
          </linearGradient>
        </defs>

        <!-- Outer Squircle Container -->
        <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad104a)" stroke="#2e1a1c" stroke-width="3"/>
        <rect x="32" y="32" width="448" height="448" rx="100" fill="none" stroke="#DE2626" stroke-width="1.5" stroke-dasharray="12 6" opacity="0.7"/>

        <!-- Orbiting Telemetry Rings -->
        <g class="anim-gear">
          <circle cx="256" cy="256" r="176" fill="none" stroke="#221416" stroke-width="2"/>
          <circle cx="256" cy="256" r="176" fill="none" stroke="#DE2626" stroke-width="3" stroke-dasharray="24 64" stroke-linecap="round"/>
          <circle cx="432" cy="256" r="6" fill="#DE2626"/>
          <circle cx="80" cy="256" r="6" fill="#DE2626"/>
        </g>

        <!-- Base Cube Body -->
        <g>
          <!-- Left Face -->
          <polygon points="256,252 166,304 166,408 256,460" fill="url(#baseLeft)" stroke="#3e2428" stroke-width="2"/>
          <!-- Right Face -->
          <polygon points="256,252 346,304 346,408 256,460" fill="url(#baseRight)" stroke="#3e2428" stroke-width="2"/>
          <!-- Base Spine -->
          <line x1="256" y1="252" x2="256" y2="460" stroke="#DE2626" stroke-width="3"/>

          <!-- Plasma Beams Connecting Base to Floating Top -->
          <line x1="256" y1="252" x2="256" y2="195" stroke="#DE2626" class="anim-plasma"/>
          <line x1="166" y1="304" x2="166" y2="245" stroke="#DE2626" class="anim-plasma"/>
          <line x1="346" y1="304" x2="346" y2="245" stroke="#DE2626" class="anim-plasma"/>

          <!-- Floating Top Cap with Independent Levitation -->
          <g class="anim-float">
            <!-- Levitating Diamond Top -->
            <polygon points="256,120 346,172 256,224 166,172" fill="url(#floatingTop)" stroke="#DE2626" stroke-width="3"/>
            <!-- Inner Facet Traces -->
            <line x1="256" y1="120" x2="256" y2="224" stroke="#DE2626" stroke-width="2"/>
            <line x1="166" y1="172" x2="346" y2="172" stroke="#DE2626" stroke-width="2"/>

            <!-- Floating Cap Vertices -->
            <circle cx="256" cy="120" r="5" fill="#DE2626"/>
            <circle cx="346" cy="172" r="5" fill="#FFFFFF"/>
            <circle cx="166" cy="172" r="5" fill="#FFFFFF"/>
            <circle cx="256" cy="224" r="6" fill="#DE2626" filter="drop-shadow(0 0 6px #DE2626)"/>
          </g>
        </g>

        <!-- Monogram & Label -->
        <text x="256" y="80" fill="#DE2626" font-size="16" font-family="monospace" font-weight="700" letter-spacing="4" text-anchor="middle">BEJSON 104a</text>
        <text x="256" y="98" fill="#776666" font-size="10" font-family="monospace" letter-spacing="2" text-anchor="middle">FLOATING CAP CUBE</text>
      </svg>